name: VNStock Quant Forward Runner

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Lịch chạy theo Giờ UTC (Bằng giờ Việt Nam trừ đi 7 tiếng)
    # Chạy T2 đến T6 (1-5)
    
    # 1. T1: Cập nhật giá Open (09:15 VN -> 02:15 UTC)
    - cron: '15 2 * * 1-5'
    
    # 2. T3: Chốt lệnh (15:00 VN -> 08:00 UTC)
    - cron: '0 8 * * 1-5'
    
    # 3. T0: Sinh tín hiệu AI mới (16:00 VN -> 09:00 UTC)
    - cron: '0 9 * * 1-5'
    
  workflow_dispatch:
    inputs:
      task:
        description: 'Task cần chạy (t0, t1, t3)'
        required: true
        default: 't0'

jobs:
  run-quant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install vnstock pandas scikit-learn supabase python-dotenv

      - name: Determine Task from Cron
        id: task_selector
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "TASK=${{ github.event.inputs.task }}" >> $GITHUB_ENV
          else
            HOUR=$(date -u +"%H")
            if [ "$HOUR" == "02" ] || [ "$HOUR" == "2" ]; then
              echo "TASK=t1" >> $GITHUB_ENV
            elif [ "$HOUR" == "08" ] || [ "$HOUR" == "8" ]; then
              echo "TASK=t3" >> $GITHUB_ENV
            elif [ "$HOUR" == "09" ] || [ "$HOUR" == "9" ]; then
              echo "TASK=t0" >> $GITHUB_ENV
            else
              echo "TASK=t0" >> $GITHUB_ENV # fallback
            fi
          fi

      - name: Run Daily Forward Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python daily_forward_runner.py --task $TASK
